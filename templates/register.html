<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - Hoc Tap Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded shadow-md w-96">
        <h2 class="text-2xl font-bold mb-4 text-center">Đăng ký tài khoản</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Tên đăng nhập" class="w-full p-2 border mb-4 rounded" required>
            <input type="password" name="password" placeholder="Mật khẩu" class="w-full p-2 border mb-4 rounded" required>
            <button type="submit" class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600">Đăng ký</button>
        </form>
        <p class="mt-4 text-center text-sm">Đã có tài khoản? <a href="/login" class="text-blue-500">Đăng nhập</a></p>
    </div>
</body>
</html>
